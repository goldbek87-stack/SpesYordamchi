name: Build SpesYordamchi.exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name SpesYordamchi --collect-all pdfplumber --collect-all pypdfium2 spes_yordamchi.py
      - uses: actions/upload-artifact@v4
        with:
          name: SpesYordamchi
          path: dist/SpesYordamchi.exe
